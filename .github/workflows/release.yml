name: Release

# Push a tag like v0.2.5 (matching "version" in package.json) to build every Linux
# package for x86_64 and arm64 and publish them on the GitHub release for that tag.
# Release notes come from the matching "## <version>" section of CHANGELOG.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build, e.g. v0.2.4
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Tag must match package.json version
        run: |
          version="$(node -p 'require("./package.json").version')"
          test "v${version}" = "${TAG}" || { echo "Tag ${TAG} does not match version ${version}"; exit 1; }
          echo "VERSION=${version}" >> "$GITHUB_ENV"
      - name: Build tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq rpm libarchive-tools xvfb libgtk-3-0t64 libnss3 libasound2t64 libgbm1 > /dev/null
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm ci
      - run: npm run check
      - run: npm audit --omit=dev --audit-level=low
      - name: Build RPM, DEB, AppImage and tar.gz for x86_64 and arm64
        run: node scripts/package.js outlook-for-linux all --arch=x64,arm64
      - name: Hardening check of the x86_64 build
        run: xvfb-run --auto-servernum node scripts/check-fuses.js dist/outlook-for-linux/linux-unpacked/outlook-for-linux
      - name: Release notes (CHANGELOG.md + merged pull requests)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --tags --force --quiet
          node scripts/release-notes.js "${VERSION}" --repo "${GITHUB_REPOSITORY}" > notes.md
          cat notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist/outlook-for-linux
          files=$(ls *.rpm *.deb *.AppImage *.tar.gz latest-linux*.yml SHA256SUMS)
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" $files --clobber
            gh release edit "$TAG" --notes-file ../../notes.md --title "v${VERSION}"
          else
            gh release create "$TAG" $files --title "v${VERSION}" --notes-file ../../notes.md --verify-tag
          fi
